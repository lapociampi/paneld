# Make a release: Actions > release > Run workflow, or
#   gh workflow run release.yml -f bump=patch
# Bumps `version` in Cargo.toml (patch, minor or major), updates
# Cargo.lock to match, pushes that as one commit on main, then runs
# release-executor.yml on it: tests, static builds, tag vVERSION and the
# GitHub release. If the executor fails after the push, fix the cause
# and use "Re-run failed jobs" on the run (not "Re-run all jobs", which
# would bump again). It refuses to bump a version that has no release
# yet: release that one with release executor first.
# See docs/deploy.md, "Releases".
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        required: true
        type: choice
        options: [patch, minor, major]
      draft:
        description: Create the release as a draft
        type: boolean
        default: false
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: read

# Not the executor's group: a run waiting on its own called workflow
# would never start.
concurrency:
  group: release-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Bump the ${{ inputs.bump }} version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The executor's group: no bump lands while a release runs. Free
    # again before the executor below starts.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Only from main
        run: '[ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::release from main, not $GITHUB_REF"; exit 1; }'

      # The dispatched commit, so what is bumped and released is what
      # was started; credentials kept: this job pushes the bump.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"

      - name: Bump the version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          old=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [[ $old =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::Cargo.toml's version '$old' is not X.Y.Z"; exit 1; }
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          case $BUMP in
            patch) new=$major.$minor.$((patch + 1)) ;;
            minor) new=$major.$((minor + 1)).0 ;;
            major) new=$((major + 1)).0.0 ;;
            *) echo "::error::bump '$BUMP' is not patch, minor or major"; exit 1 ;;
          esac
          # A version with no release yet is either the first one or a
          # failed run's bump: release it, do not skip it.
          if ! out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$old" 2>&1); then
            case $out in
              *"HTTP 404"*) echo "::error::v$old has no release yet: run release executor with version $old (or re-run the failed jobs of its run)" ;;
              *) echo "::error::cannot check the tag: $out" ;;
            esac
            exit 1
          fi
          if out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$new" 2>&1); then
            echo "::error::tag v$new exists already"; exit 1
          fi
          case $out in *"HTTP 404"*) ;; *) echo "::error::cannot check the tag: $out"; exit 1 ;; esac
          # The workspace version is the first `version =` at column 0.
          sed -i "0,/^version = \"$old\"/s//version = \"$new\"/" Cargo.toml
          # Only the workspace's own entries in Cargo.lock change.
          cargo update --workspace
          cargo metadata --locked --format-version 1 >/dev/null
          changed=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$changed" = "Cargo.lock Cargo.toml " ] || { echo "::error::the bump changed: $changed"; exit 1; }
          git diff
          echo "$old -> $new"
          echo "version=$new" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        id: commit
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "release v$VERSION"
          # Fails, pushing nothing, if main moved since the dispatch.
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: bump
    permissions:
      contents: write
    uses: ./.github/workflows/release-executor.yml
    with:
      version: ${{ needs.bump.outputs.version }}
      sha: ${{ needs.bump.outputs.sha }}
      draft: ${{ inputs.draft }}
      prerelease: ${{ inputs.prerelease }}
