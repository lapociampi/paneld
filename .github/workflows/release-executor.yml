# Publish a release of the version already in Cargo.toml. Usually
# called by release.yml after it bumped the version; by hand it runs as
# Actions > release executor > Run workflow, or
#   gh workflow run release-executor.yml -f version=0.2.0
# The run checks that the version matches Cargo.toml, tests the commit,
# builds the static binaries (scripts/build-static.sh --check, as for a
# Pi deploy), packs them (scripts/package-release.sh) and publishes tag
# vVERSION and a release with the archives and SHA256SUMS. Nothing is
# published unless every job passes. See docs/deploy.md, "Releases".
name: release executor

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v (must match Cargo.toml)
        required: true
        type: string
      sha:
        description: Commit to release (default main's head); for a retry, the release vX.Y.Z commit
        type: string
        default: ""
      draft:
        description: Create the release as a draft
        type: boolean
        default: false
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      sha:
        description: Commit to release (default the one the run is for)
        type: string
        default: ""
      draft:
        type: boolean
        default: false
      prerelease:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Inputs reach scripts only through env, never pasted into them.
  VERSION: ${{ inputs.version }}
  # The commit tested, built and tagged: release.yml passes its bump.
  SHA: ${{ inputs.sha || github.sha }}
  RUST_TOOLCHAIN: "1.99.1"
  ZIG_VERSION: "0.17.0"
  CARGO_ZIGBUILD_VERSION: "0.24.0"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check version and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          submodules: recursive
          persist-credentials: false

      - name: Check the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::release from main, not $GITHUB_REF"; exit 1; }
          # A commit given as `sha` must be on main too.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...main" --jq .status) \
            || { echo "::error::cannot compare $SHA with main"; exit 1; }
          case $status in identical|ahead) ;; *) echo "::error::$SHA is not on main ($status)"; exit 1 ;; esac
          # The whole string, so a newline cannot slip a second line past.
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::version '$VERSION' is not X.Y.Z or X.Y.Z-pre"; exit 1; }
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ "$VERSION" = "$crate" ] || { echo "::error::version $VERSION is not Cargo.toml's $crate"; exit 1; }
          # Only a 404 means the tag is free; any other failure stops here.
          if out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" 2>&1); then
            echo "::error::tag v$VERSION exists already"; exit 1
          fi
          case $out in *"HTTP 404"*) ;; *) echo "::error::cannot check the tag: $out"; exit 1 ;; esac

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-dev libsdl2-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check the examples
        run: |
          for c in examples/*/paneld.conf; do
            target/debug/paneld check -c "$c"
          done

  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        target: [aarch64-unknown-linux-musl, x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          submodules: recursive
          persist-credentials: false

      # llvm: llvm-objdump for scripts/check-musl-malloc.sh.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-dev llvm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION"

      - name: Build
        run: sh scripts/build-static.sh --check "${{ matrix.target }}" -- --locked --features device

      - name: Pack
        run: scripts/package-release.sh "$VERSION" "${{ matrix.target }}" dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish v${{ inputs.version }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          set -- ./paneld-*.tar.gz
          [ $# = 2 ] && [ -f "$1" ] || { echo "::error::expected 2 archives, got: $*"; exit 1; }
          # Names without ./ in the file, as sha256sum -c expects them.
          sha256sum -- "${@#./}" > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            if [ -n "$prev" ]; then
              echo "Changes since $prev:"
              range=$prev..HEAD
            else
              echo "Changes:"
              range=HEAD
            fi
            echo
            git log --no-merges --invert-grep --grep='^release v' --format='- %s' "$range"
            echo
            echo "Install: unpack the archive for your board (aarch64 for a Raspberry Pi 3, 4 or 5 on a 64-bit OS) and follow its INSTALL.md."
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -- --target "$SHA" --title "paneld v$VERSION" --notes-file notes.md
          if [ "$DRAFT" = true ]; then set -- "$@" --draft; fi
          if [ "$PRERELEASE" = true ]; then set -- "$@" --prerelease; fi
          # A tag pushed since the check would take the release (gh
          # ignores --target for an existing tag): only a free tag, or
          # one on this very commit, goes ahead.
          if sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$VERSION" --jq .sha 2>/dev/null) && [ "$sha" != "$SHA" ]; then
            echo "::error::tag v$VERSION now points at $sha, not $SHA"; exit 1
          fi
          gh release create "v$VERSION" "$@" dist/*.tar.gz dist/SHA256SUMS
