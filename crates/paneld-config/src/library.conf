# Library items: shipped defaults, written in the config language
# (themes.md, "Precedence"). A config (or theme) replaces a component
# or page by defining one with the same name. The actions are the
# built-in ones (ADR 0016); the daemon runs them itself.

# Acknowledge an alert: it stays listed but leaves the banner.
action alert_ack {
    param id: string
}

# Hide an alert until `for` has passed. Left out, `for` is the first
# of `alerts:snooze` (1d unless set); `= 1d` here only makes it
# optional.
action alert_snooze {
    param id: string
    param for: duration = 1d
}

# Mark a due reminder done (schema 10): `id` is its name or its alert
# id; the next one is due a step after today.
action reminder_done {
    param id: string
}

# Wraps every page (schema section 8): header with the page title and
# the alert count, a banner for the most severe alert not yet
# acknowledged or snoozed, the page body (`slot`), and the navigation
# for pages that have `nav`: buttons sharing the width, titles cut
# with `...` when they do not fit, and with more than 5 pages only
# the icon of a page that has one. The banner and the count open the
# `alerts` page. Paddings are literals: the schema reads `padding`
# and `gap` once, not as expressions; they match the built-in
# `padding` / `gap` tokens.
component shell {
    column {
        width      = 100%
        height     = 100%
        padding    = 0
        gap        = 0
        radius     = 0
        border     = 0
        background = {{ theme.background }}

        row {
            width      = 100%
            padding    = 12
            gap        = 8
            background = {{ theme.surface }}
            radius     = 0
            border     = 0
            justify    = between
            align      = center
            text { value = {{ page.title }}; font = {{ theme.font_big }}; color = {{ theme.text }} }
            text {
                visible = {{ alerts.count > 0 }}
                value   = {{ string(alerts.count) }} {{ alerts.count == 1 ? 'alert' : 'alerts' }}
                color   = {{ alerts.worst == 'critical' ? theme.critical : alerts.worst == 'warning' ? theme.warning : theme.info }}
                on_tap { goto = alerts }
            }
        }

        row {
            visible    = {{ len(alerts.shown) > 0 ? alerts.shown[0].severity != 'info' : false }}
            width      = 100%
            padding    = 12
            radius     = 0
            border     = 0
            background = {{ len(alerts.shown) > 0 && alerts.shown[0].severity == 'critical' ? theme.critical : theme.warning }}
            text { value = {{ len(alerts.shown) > 0 ? alerts.shown[0].title : '' }}; color = #ffffff }
            on_tap { goto = alerts }
        }

        column {
            width      = 100%
            grow       = 1
            padding    = 12
            gap        = 8
            radius     = 0
            border     = 0
            background = {{ theme.background }}
            slot { }
        }

        row {
            visible    = {{ len(nav) > 1 }}
            width      = 100%
            padding    = 8
            gap        = 8
            background = {{ theme.surface }}
            radius     = 0
            border     = 0
            justify    = evenly
            repeat p in {{ nav }} {
                button {
                    grow       = 1
                    label      = {{ len(nav) > 5 && p.icon != '' ? '' : p.title }}
                    icon       = {{ p.icon }}
                    background = {{ p.current ? theme.accent : theme.muted }}
                    on_tap { goto = {{ p.name }} }
                }
            }
        }
    }
}

# Every active alert, worst first, with Acknowledge and Snooze (Done
# and Snooze for a due reminder), then the newest resolved ones.
# Reached from the shell's banner and alert count, not from `nav`.
page alerts {
    title = Alerts
    text { visible = {{ alerts.count == 0 }}; value = No alerts; color = {{ theme.muted }} }
    repeat a in {{ alerts.active }} {
        column {
            width      = 100%
            padding    = 12
            gap        = 6
            background = {{ theme.surface }}
            row {
                width   = 100%
                justify = between
                align   = center
                padding = 0
                border  = 0
                text {
                    value = {{ a.title }}
                    color = {{ a.severity == 'critical' ? theme.critical : a.severity == 'warning' ? theme.warning : theme.info }}
                }
                text {
                    value = {{ a.acked ? 'acknowledged' : a.snoozed ? 'snoozed' : '' }}
                    color = {{ theme.muted }}
                }
            }
            text { visible = {{ a.text != '' }}; value = {{ a.text }}; color = {{ theme.text }} }
            row {
                gap     = 8
                padding = 0
                border  = 0
                button {
                    visible = {{ a.rule == 'reminder' }}
                    label   = Done
                    on_tap reminder_done { id = {{ a.id }} }
                }
                button {
                    visible = {{ !a.acked && a.rule != 'reminder' }}
                    label   = Acknowledge
                    on_tap alert_ack { id = {{ a.id }} }
                }
                repeat d in {{ alerts.snooze }} {
                    button {
                        label = Snooze {{ d }}
                        on_tap alert_snooze { id = {{ a.id }}; for = {{ d }} }
                    }
                }
            }
        }
    }
    # The newest resolved ones (`alerts.history` has them all).
    text { visible = {{ len(alerts.recent) > 0 }}; value = Resolved; color = {{ theme.muted }} }
    repeat h in {{ alerts.recent }} {
        row {
            width      = 100%
            padding    = 0
            border     = 0
            background = {{ theme.background }}
            justify    = between
            text { value = {{ h.title }}; color = {{ theme.text }} }
            text { value = {{ ago(h.ended) }}; color = {{ theme.muted }} }
        }
    }
}

# The shipped themes, selectable by name (`screen:theme = dark`) with
# no folder; a config theme or a `themes/<name>/` folder of the same
# name replaces one. `light` is the built-in default (the tokens every
# theme starts from, schema 11), written out; `dark` is its night
# counterpart, with the same fonts and sizes so a switch does not move
# anything.
theme light {
    background = #f5f5f5
    surface    = #ffffff
    text       = #212121
    muted      = #757575
    accent     = #2196f3
    ok         = #2e7d32
    info       = #1976d2
    warning    = #ef6c00
    critical   = #d32f2f
    font_small = roboto 12
    font       = roboto 16
    font_big   = roboto 24
    font_huge  = roboto 32
    gap        = 8
    padding    = 12
    radius     = 8
    tap_min    = 48
    shadow     = none
    icons      = builtin
    motion     = reduced
}

theme dark {
    extends    = light
    background = #121212
    surface    = #1e1e1e
    text       = #e6e6e6
    muted      = #6f6f6f
    accent     = #1e88e5
    ok         = #43a047
    info       = #42a5f5
    warning    = #fb8c00
    critical   = #e53935
    dialog_backdrop = #00000099
}
