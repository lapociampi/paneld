[package]
name = "paneld-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe LVGL wrapper and UI tree builder for paneld."

[dependencies]
lvgl-sys = { path = "../lvgl-sys", default-features = false }
paneld-config.workspace = true

[features]
default = ["sdl"]
sdl = ["lvgl-sys/sdl"]
drm = ["lvgl-sys/drm"]
device = ["drm"]

# Per ADR 0001 the `ui` module is where paneld's unsafe code lives.
# Reasserting the workspace defaults for the rest.
[lints.rust]
unsafe_code = "allow"
