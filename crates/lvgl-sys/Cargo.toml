[package]
name = "lvgl-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Raw FFI bindings to LVGL 9, built from vendored source."
links = "lvgl"
build = "build.rs"

[features]
default = ["sdl"]
# PC build: SDL2 window driver. Needs libSDL2-dev / SDL2 headers.
sdl = []
# Linux device build: DRM/KMS + fbdev + evdev. Needs libdrm headers.
drm = []
# Default device profile: DRM + fbdev + evdev, no SDL.
device = ["drm"]

[build-dependencies]
bindgen = "0.72"
cc = "1.2"
pkg-config = "0.3"

[lib]
# This crate is only ever consumed by `paneld-ui`; a separate rlib
# keeps the generated FFI out of the paneld binary's symbol surface.
name = "lvgl_sys"

# The crate exposes `unsafe` extern "C" declarations; the workspace
# lint forbids `unsafe_code`, so this crate opts back in for its
# generated bindings.
[lints.rust]
unsafe_code = "allow"
