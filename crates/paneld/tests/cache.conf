# Pages for `paneld shot --fuzz-pages` (ADR 0024, page cache): pages
# kept and shown again from the cache, with what runs on its own (a
# spinner, a scrolling label, a clock, `ago()`), call states, value
# widgets, a keypad, a QR code (two shapes) and a `repeat` whose items
# change while its page is kept.
var x: int = 0
var mode: string = "a"
var on: bool = false
action slow { busy = wait; run = sleep 0.3 }
action quick { run = true }
source s { run = echo 1; parse = number; poll = 1h }
source t { run = echo hi; poll = 1h }

page home { nav = 1; column {
    text { value = {{ vars.x }} / {{ ago(sources.s.at) }} }
    text { value = {{ now.time }}:{{ now.second }} }
    bar { width = 200; value = {{ sources.s.value * 10 }} }
    button { width = 160; height = 40; label = run; on_tap = slow }
    spinner { width = 30; height = 30; visible = {{ vars.x > 1 }} }
    chart { width = 200; height = 60; series { values = {{ [sources.s.value, vars.x, 3] }} } }
} }

page two { nav = 2; column {
    text { width = 60; overflow = scroll; value = {{ sources.t.value }} and more text than fits }
    toggle { value = {{ vars.on }}; on_change { set { on = {{ value }} } } }
    select { width = 120; options = {{ ['a', 'b', 'c'] }}; value = {{ vars.mode }}; on_change { set { mode = {{ value }} } } }
    button { width = 160; height = 40; label = {{ vars.mode }}; on_tap = quick }
    arc { value = {{ vars.x * 10 }} }
    qr { size = 80; data = {{ sources.t.ok ? sources.t.value : "" }} }
} }

page three { nav = 3; column {
    keypad { length = 4; on_submit { set { x = {{ int(value) }} } } }
    slider { width = 200; value = {{ vars.x }}; on_change { set { x = {{ value }} } } }
    text { value = {{ sources.t.value }} {{ alerts.count }} }
    repeat a in {{ alerts.active }} { button { height = 30; label = {{ a.title }}; on_tap = quick } }
} }
