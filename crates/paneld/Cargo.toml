[package]
name = "paneld"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "paneld: a generic touch panel"

[[bin]]
name = "paneld"
path = "src/main.rs"

[dependencies]
paneld-config.workspace = true
paneld-ui = { path = "../paneld-ui", default-features = false }

[features]
default = ["sdl"]
sdl = ["paneld-ui/sdl"]
drm = ["paneld-ui/drm"]
device = ["drm"]

[lints]
workspace = true
