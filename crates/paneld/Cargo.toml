[package]
name = "paneld"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "paneld: a generic touch panel"

[[bin]]
name = "paneld"
path = "src/main.rs"

[dependencies]
paneld-config.workspace = true
paneld-ui = { path = "../paneld-ui", default-features = false }
# nix provides safe wrappers for the two POSIX syscalls the runner
# needs (killpg + kill(_, 0) for liveness) so the whole crate stays
# on the workspace's `unsafe_code = "forbid"` lint.
nix = { version = "0.29", default-features = false, features = ["signal"] }
# Schema section 14: the PIN is stored as an argon2 PHC hash in a
# secret. Verifying it needs the real KDF; `alloc` + `password-hash`
# only, no rand/std extras.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }

[features]
default = ["sdl"]
sdl = ["paneld-ui/sdl"]
drm = ["paneld-ui/drm"]
device = ["drm"]

[lints]
workspace = true
