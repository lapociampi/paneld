# Library components: shipped defaults, written in the config
# language. A config (or theme) replaces one by defining a component
# with the same name (themes.md, "Precedence").

# Wraps every page (schema section 8): header with the page title and
# an alert count, an alert banner, the page body (`slot`), and the
# navigation for pages that have `nav`. Paddings are literals: the
# schema reads `padding` and `gap` once, not as expressions; they match the
# built-in `padding` / `gap` tokens.
component shell {
    column {
        width      = 100%
        height     = 100%
        padding    = 0
        gap        = 0
        radius     = 0
        border     = 0
        background = {{ theme.background }}

        row {
            width      = 100%
            padding    = 12
            gap        = 8
            background = {{ theme.surface }}
            radius     = 0
            border     = 0
            justify    = between
            align      = center
            text { value = {{ page.title }}; font = {{ theme.font_big }}; color = {{ theme.text }} }
            text {
                visible = {{ alerts.count > 0 }}
                value   = {{ string(alerts.count) }} {{ alerts.count == 1 ? 'alert' : 'alerts' }}
                color   = {{ alerts.worst == 'critical' ? theme.critical : alerts.worst == 'warning' ? theme.warning : theme.info }}
            }
        }

        row {
            visible    = {{ alerts.count > 0 }}
            width      = 100%
            padding    = 12
            radius     = 0
            border     = 0
            background = {{ alerts.worst == 'critical' ? theme.critical : alerts.worst == 'warning' ? theme.warning : theme.info }}
            text { value = {{ alerts.count > 0 ? alerts.active[0].title : '' }}; color = #ffffff }
        }

        column {
            width   = 100%
            grow    = 1
            padding = 12
            gap     = 8
            radius  = 0
            border  = 0
            background = {{ theme.background }}
            slot { }
        }

        row {
            visible    = {{ len(nav) > 1 }}
            width      = 100%
            padding    = 8
            gap        = 8
            background = {{ theme.surface }}
            radius     = 0
            border     = 0
            justify    = evenly
            repeat p in {{ nav }} {
                button {
                    label      = {{ p.title }}
                    background = {{ p.current ? theme.accent : theme.muted }}
                    on_tap { goto = {{ p.name }} }
                }
            }
        }
    }
}
