# Deep blue-black with a cyan accent, readable from across a room.
theme midnight {
    background = #0b0f14
    surface    = #151c25
    text       = #e6edf3
    muted      = #7d8b99
    accent     = #22d3ee
    ok         = #34d399
    info       = #60a5fa
    warning    = #fbbf24
    critical   = #f87171

    # Extra tokens, read as theme.track and theme.accent2.
    track   = #243041
    accent2 = #a78bfa
    on_accent = #0b0f14

    font_small = roboto 14
    font       = roboto 16
    font_big   = roboto 20
    font_huge  = roboto 32

    gap     = 10
    padding = 12
    radius  = 12
    tap_min = 48
    shadow  = none
    icons   = builtin
    motion  = reduced

    style row    { padding = 0; border = 0; color = {{ theme.text }} }
    style column { padding = 0; border = 0; color = {{ theme.text }} }
    style stack  { padding = 0; border = 0; color = {{ theme.text }} }

    style .card { background = {{ theme.surface }}; radius = {{ theme.radius }}; padding = {{ theme.padding }}; border = 0 }
}
