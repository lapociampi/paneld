# System monitor: the machine paneld runs on, read from /proc by
# stats.sh. Runs on any Linux as is:
#
#   paneld -c examples/system/paneld.conf
#
# Every number comes from one short `sh` run per poll; the sources
# poll only while a page that shows them is on screen.

include = theme.conf

screen {
    theme = midnight
    idle  = 5m
}

# CPU busy %, sampled over a second; ten minutes kept for the chart.
source cpu {
    poll    = 2s
    run     = sh stats.sh cpu
    parse   = number
    history = 10m
    active  = visible
}

# Network throughput, bytes per second.
source rx {
    poll    = 2s
    run     = sh stats.sh rx
    parse   = number
    history = 10m
    active  = visible
}

source tx {
    poll    = 2s
    run     = sh stats.sh tx
    parse   = number
    history = 10m
    active  = visible
}

# Memory, disk, temperature, load, uptime.
source sys {
    poll   = 10s
    run    = sh stats.sh summary
    parse  = json
    active = visible
}

source top {
    poll   = 5s
    run    = sh stats.sh top
    parse  = json
    active = visible
}

# A round gauge with the value in the middle and a label under it.
component gauge {
    param label: string
    param value: number
    param text: string
    param detail: string = ""

    column {
        class = card
        grow  = 1
        align = center
        gap   = 4
        stack {
            width  = 132
            height = 132
            arc {
                width     = 132
                height    = 132
                value     = {{ value }}
                thickness = 12
                rounded   = true
                track     = {{ theme.track }}
                color     = {{ value >= 90 ? theme.critical : value >= 75 ? theme.warning : theme.accent }}
            }
            text { anchor = center; value = {{ text }}; font = {{ theme.font_huge }} }
        }
        text { value = {{ label }}; color = {{ theme.muted }} }
        text { value = {{ detail }}; font = {{ theme.font_small }}; color = {{ theme.muted }} }
    }
}

# A label over a value, for the strip of small facts.
component fact {
    param label: string
    param value: string

    column {
        grow = 1
        gap  = 2
        text { value = {{ label }}; font = {{ theme.font_small }}; color = {{ theme.muted }} }
        text { value = {{ value }}; font = {{ theme.font_big }} }
    }
}

page overview {
    title = System
    icon  = home
    nav   = 1

    row {
        width = 100%
        gap   = 10
        gauge {
            label  = CPU
            value  = {{ sources.cpu.ok ? sources.cpu.value : 0 }}
            text   = {{ sources.cpu.ok ? string(sources.cpu.value) + '%' : '-' }}
            detail = {{ sources.sys.ok ? string(sources.sys.value.cores) + ' cores' : '' }}
        }
        gauge {
            label  = Memory
            value  = {{ sources.sys.ok ? 100.0 * sources.sys.value.mem_used / sources.sys.value.mem_total : 0 }}
            text   = {{ sources.sys.ok ? format(100.0 * sources.sys.value.mem_used / sources.sys.value.mem_total, '%') : '-' }}
            detail = {{ sources.sys.ok ? format(sources.sys.value.mem_used, 'bytes') + ' of ' + format(sources.sys.value.mem_total, 'bytes') : '' }}
        }
        gauge {
            label  = Disk
            value  = {{ sources.sys.ok ? 100.0 * sources.sys.value.disk_used / sources.sys.value.disk_total : 0 }}
            text   = {{ sources.sys.ok ? format(100.0 * sources.sys.value.disk_used / sources.sys.value.disk_total, '%') : '-' }}
            detail = {{ sources.sys.ok ? format(sources.sys.value.disk_used, 'bytes') + ' of ' + format(sources.sys.value.disk_total, 'bytes') : '' }}
        }
    }

    row {
        class = card
        width = 100%
        fact { label = Host; value = {{ sources.sys.ok ? sources.sys.value.host : '-' }} }
        fact { label = Load; value = {{ sources.sys.ok ? sources.sys.value.load.map(l, string(l)).join(' ') : '-' }} }
        fact { label = Temperature; value = {{ sources.sys.ok && sources.sys.value.temp != null ? format(sources.sys.value.temp, 'C') : '-' }} }
        fact { label = Up; value = {{ sources.sys.ok ? duration(sources.sys.value.uptime) : '-' }} }
    }
}

page cpu {
    title = CPU
    icon  = charge
    nav   = 2

    column {
        class = card
        width = 100%
        grow  = 1
        row {
            width   = 100%
            justify = between
            text { value = Last 10 minutes; color = {{ theme.muted }} }
            text { value = {{ sources.cpu.ok ? string(sources.cpu.value) + '%' : '-' }}; font = {{ theme.font_big }}; color = {{ theme.accent }} }
        }
        chart {
            type      = area
            width     = 100%
            grow      = 1
            min       = 0
            max       = 100
            points    = 300
            divisions = 3 0
            series { values = {{ sources.cpu.history }}; color = {{ theme.accent }} }
        }
    }
}

page network {
    title = Network
    icon  = wifi
    nav   = 3

    column {
        class = card
        width = 100%
        grow  = 1
        row {
            width = 100%
            gap   = 24
            text { value = Down {{ sources.rx.ok ? format(sources.rx.value, 'bytes') + '/s' : '-' }}; font = {{ theme.font_big }}; color = {{ theme.accent }} }
            text { value = Up {{ sources.tx.ok ? format(sources.tx.value, 'bytes') + '/s' : '-' }}; font = {{ theme.font_big }}; color = {{ theme.accent2 }} }
        }
        chart {
            type      = line
            width     = 100%
            grow      = 1
            min       = 0
            points    = 300
            divisions = 3 0
            series { values = {{ sources.rx.history }}; color = {{ theme.accent }} }
            series { values = {{ sources.tx.history }}; color = {{ theme.accent2 }} }
        }
    }
}

page processes {
    title = Processes
    icon  = list
    nav   = 4

    repeat p in {{ sources.top.ok ? sources.top.value : [] }} {
        row {
            class = card
            width = 100%
            align = center
            gap   = 12
            text { value = {{ p.name }}; width = 220; overflow = dots }
            bar {
                grow  = 1
                min   = 0
                max   = 100
                value = {{ p.cpu }}
                track = {{ theme.track }}
            }
            text { value = {{ format(p.cpu, '%') }}; width = 70; align = right }
            text { value = {{ format(p.mem, 'bytes') }}; width = 100; align = right; color = {{ theme.muted }} }
        }
    }
}
