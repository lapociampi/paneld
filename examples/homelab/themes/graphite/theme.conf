# Graphite: a dark rack theme with a side bar instead of the bottom
# navigation. The `shell` component below replaces the shipped one
# while this theme is active, so pages stay the same.
theme graphite {
    background = #0e1116
    surface    = #171b22
    text       = #e6e9ef
    muted      = #8a93a3
    accent     = #5eead4
    ok         = #4ade80
    info       = #60a5fa
    warning    = #fbbf24
    critical   = #f87171

    # Extra tokens, read as theme.<name>.
    raised = #1f2530
    track  = #262d38
    line   = #2b3340

    font_small = inter 13
    font       = inter 16
    font_big   = inter 20 bold
    font_huge  = inter 30 bold

    gap     = 10
    padding = 12
    radius  = 12
    tap_min = 48
    shadow  = 12 #00000070 0 4
    icons   = builtin
    motion  = reduced

    dialog_backdrop = #000000a0

    style row    { padding = 0; border = 0 }
    style column { padding = 0; border = 0 }
    style grid   { padding = 0; border = 0 }

    style .card { background = surface; radius = 12; padding = 12; border = 1 line }
    style .card:pressed { background = raised }
    style button { background = raised; color = text; radius = 10; border = 1 line }
    style button:pressed { background = line }
    style .danger { background = #3a1d22; color = critical; border = 1 #5b2a31 }
    style .go { background = #12352b; color = ok; border = 1 #1d4d3d }

    component shell {
        row {
            width   = 100%
            height  = 100%
            gap     = 0

            # Side bar: one icon button per page with `nav`.
            column {
                width      = 84
                height     = 100%
                padding    = 10 8
                gap        = 8
                background = surface
                align      = center
                icon { name = drive; size = 28; color = accent }
                text { value = rack; font = {{ theme.font_small }}; color = {{ theme.muted }} }
                column {
                    grow  = 1
                    width = 100%
                    gap   = 6
                    justify = center
                    repeat p in {{ nav }} {
                        column {
                            width      = 100%
                            padding    = 8 0
                            gap        = 2
                            radius     = 10
                            align      = center
                            background = {{ p.current ? theme.raised : theme.surface }}
                            on_tap { goto = {{ p.name }} }
                            icon { name = {{ p.icon }}; size = 22; color = {{ p.current ? theme.accent : theme.muted }} }
                            text { value = {{ p.title }}; width = 100%; align = center; overflow = dots; font = {{ theme.font_small }}; color = {{ p.current ? theme.text : theme.muted }} }
                        }
                    }
                }
            }

            column {
                grow    = 1
                height  = 100%
                padding = 14 16
                gap     = 12

                # Header: title, alerts, clock.
                row {
                    width   = 100%
                    justify = between
                    align   = center
                    text { value = {{ page.title }}; font = {{ theme.font_huge }} }
                    row {
                        gap   = 14
                        align = center
                        row {
                            visible = {{ alerts.count > 0 }}
                            gap     = 6
                            align   = center
                            padding = 6 10
                            radius  = 14
                            background = {{ alerts.worst == 'critical' ? '#3a1d22' : '#3a2f12' }}
                            on_tap { goto = alerts }
                            icon { name = warning; size = 16; color = {{ alerts.worst == 'critical' ? theme.critical : theme.warning }} }
                            text {
                                value = {{ string(alerts.count) }} {{ alerts.count == 1 ? 'alert' : 'alerts' }}
                                color = {{ alerts.worst == 'critical' ? theme.critical : theme.warning }}
                            }
                        }
                        text { value = {{ now.time }}; font = {{ theme.font_big }}; color = {{ theme.muted }} }
                    }
                }

                column {
                    width = 100%
                    grow  = 1
                    gap   = 10
                    slot { }
                }
            }
        }
    }
}
