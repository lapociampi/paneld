# Homelab rack: services at a glance, VMs you can start and stop
# behind a PIN, storage pools, and alerts that raise a banner.
#
#   paneld -c examples/homelab/paneld.conf
#
# Out of the box every source reads demo data from demo/, so it runs
# anywhere. Above each one is the command a real rack would use;
# swap them in one by one. The PIN for the demo is 1234 (pin.hash,
# made with `paneld hash-pin`).

screen {
    theme = graphite      # themes/graphite/theme.conf
    idle  = 2m
}

security {
    pin        = pin
    unlock_for = 1m
}

secret pin { file = pin.hash }

# --- Sources -------------------------------------------------------------

# One entry per service: name, icon, state (ok/warning/critical), detail.
# Real: a script that asks each service (curl -sf ...) and prints JSON.
source services {
    poll  = 30s
    run   = cat demo/services.json
    parse = json
}

# Real: run = curl -sf --cacert pve-root-ca.pem -H "Authorization: PVEAPIToken=..." \
#           https://pve:8006/api2/json/nodes/pve/qemu   (or a remote_kind with `ca`)
source vms {
    poll  = 15s
    run   = cat demo/vms.json
    parse = json
}

# Real: run = sh -c 'zpool list -Hp -o name,health,alloc,size | ...'
source pools {
    poll  = 5m
    run   = cat demo/pools.json
    parse = json
}

source host {
    poll  = 10s
    run   = cat demo/host.json
    parse = json
}

# Round-trip time to the internet, in ms: the last hour, newest last.
# Real: a number with history, and the chart reads its history:
#   source ping {
#       poll    = 30s
#       run     = sh -c 'ping -c1 -W2 1.1.1.1 | sed -n "s/.*time=\([0-9.]*\).*/\1/p"'
#       parse   = number
#       history = 1h
#   }
source ping {
    poll  = 30s
    run   = sh demo/latency.sh
    parse = json
}

# --- Actions -------------------------------------------------------------

# Real: run = curl -sf -X POST ... /qemu/{{ vm }}/status/start
action vm_start {
    param vm: int
    param name: string
    title = Start {{ name }}
    pin   = true
    run   = sleep 2
    busy  = Starting
    done  = {{ name }} started
    refresh = vms
}

action vm_stop {
    param vm: int
    param name: string
    title   = Stop {{ name }}
    pin     = true
    confirm = Shut down {{ name }}?
    run     = sleep 2
    busy    = Stopping
    done    = {{ name }} is shutting down
    refresh = vms
}

# Quick actions on the overview.
# Real: run = wakeonlan aa:bb:cc:dd:ee:ff
action wake_desktop {
    title = Wake the desktop
    run   = sleep 1
    done  = Wake-up sent
}

# Real: run = ssh router reboot   (or a remote_kind with via = ssh)
action reboot_router {
    title   = Reboot the router
    pin     = true
    confirm = Reboot the router? The internet drops for about two minutes.
    run     = sleep 2
    busy    = Rebooting
    done    = Router is rebooting
}

# Real: run = curl -sf -u ... -H 'Content-Type: application/json' \
#           -d '{"enabled": false, "duration": {{ minutes * 60000 }}}' http://adguard/control/protection
action pause_ads {
    param minutes: int { ask = select; options = [5, 30, 60]; label = Pause ad blocking for }
    title = Pause ad blocking
    run   = sleep 1
    done  = Ads unblocked for {{ minutes }} min
}

action scrub {
    param pool: string
    title   = Scrub {{ pool }}
    confirm = Start a scrub of {{ pool }}? It reads every disk and takes hours.
    run     = sleep 1
    done    = Scrub of {{ pool }} started
}

# --- Alerts --------------------------------------------------------------

alert pool_degraded {
    when     = {{ sources.pools.value.exists(p, p.health != 'ONLINE') }}
    severity = critical
    title    = A pool is degraded
    text     = {{ sources.pools.value.filter(p, p.health != 'ONLINE').map(p, p.name).join(', ') }} needs attention
}

alert backups_late {
    when     = {{ sources.services.value.exists(s, s.name == 'Backups' && s.state != 'ok') }}
    severity = warning
    title    = Backups are late
}

# --- Components ----------------------------------------------------------

# A service: icon, name, a colored state dot and one line of detail.
component service {
    param s: any

    column {
        class = card
        gap   = 6
        row {
            width   = 100%
            justify = between
            align   = center
            icon { name = {{ s.icon }}; size = 20; color = {{ theme.muted }} }
            rect {
                width  = 10
                height = 10
                radius = 5
                background = {{ s.state == 'ok' ? theme.ok : s.state == 'warning' ? theme.warning : theme.critical }}
            }
        }
        text { value = {{ s.name }}; font = {{ theme.font }}; overflow = dots; width = 100% }
        text {
            value    = {{ s.detail }}
            font     = {{ theme.font_small }}
            color    = {{ s.state == 'ok' ? theme.muted : s.state == 'warning' ? theme.warning : theme.critical }}
            overflow = dots
            width    = 100%
        }
    }
}

# A small number with a label under it.
component stat {
    param label: string
    param value: string
    param tint: color = text

    column {
        grow = 1
        gap  = 2
        text { value = {{ value }}; font = {{ theme.font_big }}; color = {{ tint }} }
        text { value = {{ label }}; font = {{ theme.font_small }}; color = {{ theme.muted }} }
    }
}

# --- Pages ---------------------------------------------------------------

page overview {
    title = Overview
    icon  = home
    nav   = 1

    grid {
        width   = 100%
        columns = 4
        gap     = 10
        repeat s in {{ sources.services.ok ? sources.services.value : [] }} {
            service { s = {{ s }} }
        }
    }

    row {
        class = card
        width = 100%
        gap   = 10
        stat {
            label = CPU
            value = {{ sources.host.ok ? string(sources.host.value.cpu) + '%' : '-' }}
        }
        stat {
            label = Memory
            value = {{ sources.host.ok ? string(round(sources.host.value.mem_used)) + ' / ' + string(sources.host.value.mem_total) + ' GB' : '-' }}
        }
        stat {
            label = Ping
            value = {{ sources.ping.ok ? string(sources.ping.value[len(sources.ping.value) - 1]) + ' ms' : '-' }}
            tint  = {{ sources.ping.ok && sources.ping.value[len(sources.ping.value) - 1] > 30 ? theme.warning : theme.text }}
        }
        stat {
            label = Power
            value = {{ sources.host.ok ? string(sources.host.value.power_w) + ' W' : '-' }}
        }
        stat {
            label = Up
            value = {{ sources.host.ok ? duration(sources.host.value.uptime) : '-' }}
        }
    }

    row {
        width = 100%
        gap   = 10
        button { grow = 1; height = 52; icon = power;   label = Wake desktop;  on_tap = wake_desktop }
        button { grow = 1; height = 52; icon = pause;   label = Pause ads;     on_tap = pause_ads }
        button { grow = 1; height = 52; icon = refresh; label = Reboot router; on_tap = reboot_router; class = danger }
    }
}

page vms {
    title = VMs
    icon  = list
    nav   = 2

    repeat v in {{ sources.vms.ok ? sources.vms.value : [] }} {
        row {
            class = card
            width = 100%
            gap   = 14
            align = center
            rect {
                width  = 10
                height = 10
                radius = 5
                background = {{ v.status == 'running' ? theme.ok : theme.muted }}
            }
            column {
                width = 170
                gap   = 2
                text { value = {{ v.name }}; overflow = dots; width = 100% }
                text {
                    value = {{ v.status == 'running' ? 'up ' + duration(v.uptime) : 'stopped' }}
                    font  = {{ theme.font_small }}
                    color = {{ theme.muted }}
                }
            }
            column {
                grow = 1
                gap  = 4
                bar { width = 100%; height = 6; min = 0; max = 100; value = {{ v.cpu }}; track = track }
                text { value = CPU {{ string(v.cpu) }}%; font = {{ theme.font_small }}; color = {{ theme.muted }} }
            }
            column {
                grow = 1
                gap  = 4
                bar { width = 100%; height = 6; min = 0; max = {{ v.mem_max }}; value = {{ v.mem }}; track = track; color = info }
                text { value = {{ string(v.mem) }} / {{ string(v.mem_max) }} GB; font = {{ theme.font_small }}; color = {{ theme.muted }} }
            }
            button {
                visible = {{ v.status == 'running' }}
                width   = 104
                class   = danger
                icon    = stop
                label   = Stop
                on_tap vm_stop { vm = {{ v.id }}; name = {{ v.name }} }
            }
            button {
                visible = {{ v.status != 'running' }}
                width   = 104
                class   = go
                icon    = play
                label   = Start
                on_tap vm_start { vm = {{ v.id }}; name = {{ v.name }} }
            }
        }
    }
}

page storage {
    title = Storage
    icon  = sd_card
    nav   = 3

    repeat p in {{ sources.pools.ok ? sources.pools.value : [] }} {
        row {
            class = card
            width = 100%
            gap   = 16
            align = center
            stack {
                width  = 64
                height = 64
                arc {
                    width     = 64
                    height    = 64
                    value     = {{ 100.0 * p.used / p.size }}
                    thickness = 7
                    rounded   = true
                    track     = track
                    color     = {{ p.used / p.size > 0.85 ? theme.warning : theme.accent }}
                }
                text { anchor = center; value = {{ format(100.0 * p.used / p.size, '%') }}; font = {{ theme.font_small }} }
            }
            column {
                grow = 1
                gap  = 4
                row {
                    gap   = 10
                    align = center
                    text { value = {{ p.name }}; font = {{ theme.font_big }} }
                    text {
                        value   = {{ p.health }}
                        font    = {{ theme.font_small }}
                        color   = {{ p.health == 'ONLINE' ? theme.ok : theme.critical }}
                    }
                }
                text {
                    value = {{ string(p.used) }} of {{ string(p.size) }} TB, {{ string(p.disks) }} disks, {{ string(p.temp) }} C
                    color = {{ theme.muted }}
                }
            }
            button { label = Scrub; icon = refresh; on_tap scrub { pool = {{ p.name }} } }
        }
    }
}

page network {
    title = Network
    icon  = wifi
    nav   = 4

    column {
        class = card
        width = 100%
        grow  = 1
        gap   = 8
        row {
            width   = 100%
            justify = between
            align   = center
            text { value = Round trip to 1.1.1.1, last hour; color = {{ theme.muted }} }
            text {
                value = {{ sources.ping.ok ? string(sources.ping.value[len(sources.ping.value) - 1]) + ' ms' : '-' }}
                font  = {{ theme.font_big }}
                color = {{ theme.accent }}
            }
        }
        chart {
            type      = area
            width     = 100%
            grow      = 1
            min       = 0
            points    = 120
            divisions = 3 0
            series { values = {{ sources.ping.ok ? sources.ping.value : [] }}; color = accent }
        }
    }
}
