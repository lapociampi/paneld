# Smart home: a wall panel for lights, heating, scenes and the day's
# weather and solar power.
#
#   paneld -c examples/smart-home/paneld.conf
#
# Out of the box it runs on demo data (demo/) and its switches only
# change the screen, so it works anywhere. Each source and action
# says what a real one does with Home Assistant's REST API, through
# the `ha` remote below: set HA_TOKEN, point `url` at your instance,
# and swap the demo lines for the real ones.

screen {
    theme = daylight      # themes/daylight/theme.conf
    idle  = 1m
    night { from = 22:30; to = 06:30; brightness = 15 }
    # Brightness and power need your screen's backlight commands, e.g.:
    #   dim = sh -c 'echo "$$1" > /sys/class/backlight/<name>/brightness' sh {{ level * 255 / 100 }}
    #   off = sh -c 'echo 1 > /sys/class/backlight/<name>/bl_power'
    #   on  = sh -c 'echo 0 > /sys/class/backlight/<name>/bl_power'
}

# --- Home Assistant ----------------------------------------------------

secret ha_token { env = HA_TOKEN }

remote_kind home_assistant {
    param url: string
    param token: secret
    via     = http
    url     = {{ url }}/api
    headers { Authorization = Bearer {{ token }} }
    timeout = 5s

    # Call a service on an entity: `ha.call { domain = light;
    # service = toggle; entity = light.kitchen }`.
    action call {
        param domain: string
        param service: string
        param entity: string
        post = /services/{{ domain }}/{{ service }}
        body = {"entity_id": "{{ entity }}"}
    }
}

remote ha: home_assistant { url = http://homeassistant.local:8123; token = ha_token }

# --- Demo state --------------------------------------------------------
# With Home Assistant these come from sources (GET /api/states/<entity>);
# here the switches set them directly.

var living:      bool = true
var living_lvl:  int  = 70
var kitchen:     bool = true
var kitchen_lvl: int  = 100
var bedroom:     bool = false
var bedroom_lvl: int  = 40
var office:      bool = false
var office_lvl:  int  = 85
var hallway:     bool = true
var hallway_lvl: int  = 30
var garden:      bool = false
var garden_lvl:  int  = 100
var setpoint:  number = 21.0
var scene:     string = Evening

# --- Sources -----------------------------------------------------------

# Real: run = curl -sf "https://api.open-meteo.com/v1/forecast?latitude=...&current=..."
source weather {
    poll  = 15m
    run   = cat demo/weather.json
    parse = json
}

# Real: GET /api/states/climate.<thermostat> via a `value` of the remote.
source climate {
    poll  = 1m
    run   = cat demo/climate.json
    parse = json
}

# Door lock, washer, next bin day, solar right now.
# Real: a few GET /api/states/<entity> calls, or one HA template sensor.
source house {
    poll  = 1m
    run   = cat demo/house.json
    parse = json
}

# Real: the inverter's API, or Home Assistant's energy sensors.
source energy {
    poll  = 5m
    run   = cat demo/energy.json
    parse = json
}

# --- Actions -----------------------------------------------------------

# A scene sets several lights at once. Real: then = ha.call with
# domain = scene; service = turn_on; entity = scene.<name>.
action scene {
    param name: string
    set {
        scene    = {{ name }}
        living   = {{ name != 'Away' && name != 'Night' }}
        kitchen  = {{ name == 'Morning' || name == 'Evening' }}
        bedroom  = {{ name == 'Night' }}
        office   = {{ name == 'Morning' }}
        living_lvl = {{ name == 'Movie' ? 20 : 70 }}
        bedroom_lvl = {{ name == 'Night' ? 10 : 40 }}
    }
    done = {{ name }}
}

action warmer { set { setpoint = {{ clamp(vars.setpoint + 0.5, 15.0, 26.0) }} } }
action cooler { set { setpoint = {{ clamp(vars.setpoint - 0.5, 15.0, 26.0) }} } }

# --- Components --------------------------------------------------------

component scene_button {
    param name: string
    param glyph: string

    button {
        class  = scene
        grow   = 1
        height = 64
        icon   = {{ glyph }}
        label  = {{ name }}
        background = {{ vars.scene == name ? theme.text : theme.surface }}
        color      = {{ vars.scene == name ? theme.surface : theme.text }}
        on_tap scene { name = {{ name }} }
    }
}

# A small fact with an icon: lights on, the door, ...
component fact {
    param glyph: string
    param label: string
    param value: string

    row {
        class = card
        grow  = 1
        gap   = 10
        align = center
        icon { name = {{ glyph }}; size = 20; color = {{ theme.accent }} }
        column {
            grow = 1
            gap  = 0
            text { value = {{ label }}; font = {{ theme.font_small }}; color = {{ theme.muted }} }
            text { value = {{ value }}; width = 100%; overflow = dots }
        }
    }
}

# One room: name, on/off, and its brightness (0..100) when on.
component room {
    param name: string
    param on: bool
    param level: int

    column {
        class = card
        gap   = 4
        row {
            width   = 100%
            justify = between
            align   = center
            row {
                gap   = 10
                align = center
                icon { name = charge; size = 20; color = {{ on ? theme.accent : theme.muted }} }
                text { value = {{ name }}; font = {{ theme.font_big }} }
            }
            slot { }
        }
        text {
            value = {{ on ? string(level) + '%' : 'Off' }}
            font  = {{ theme.font_small }}
            color = {{ theme.muted }}
        }
    }
}

# --- Pages -------------------------------------------------------------

page home {
    title = Home
    icon  = home
    nav   = 1

    row {
        width = 100%
        gap   = 12

        # Weather now and the next days.
        column {
            class = card
            grow  = 3
            gap   = 10
            row {
                gap   = 16
                align = center
                text { value = {{ sources.weather.ok ? string(sources.weather.value.temp) + ' C' : '-' }}; font = {{ theme.font_huge }} }
                column {
                    gap = 2
                    text { value = {{ sources.weather.ok ? sources.weather.value.condition : '' }}; font = {{ theme.font_big }} }
                    text {
                        value = {{ sources.weather.ok ? 'Feels ' + string(sources.weather.value.feels) + ' C, wind ' + string(sources.weather.value.wind) + ' km/h' : '' }}
                        color = {{ theme.muted }}
                    }
                }
            }
            row {
                width   = 100%
                justify = between
                repeat d in {{ sources.weather.ok ? sources.weather.value.forecast : [] }} {
                    column {
                        align = center
                        gap   = 2
                        text { value = {{ d.day }}; color = {{ theme.muted }} }
                        text { value = {{ string(d.high) }} / {{ string(d.low) }}; font = {{ theme.font_big }} }
                        text { value = {{ d.rain > 0 ? string(d.rain) + '% rain' : 'dry' }}; font = {{ theme.font_small }}; color = {{ d.rain >= 50 ? theme.cool : theme.muted }} }
                    }
                }
            }
        }

        # Inside: temperature and heating.
        column {
            class = card
            grow  = 2
            gap   = 6
            text { value = Inside; color = {{ theme.muted }} }
            text { value = {{ sources.climate.ok ? string(sources.climate.value.inside) + ' C' : '-' }}; font = {{ theme.font_huge }} }
            text {
                value = {{ sources.climate.ok && sources.climate.value.heating ? 'Heating to ' + string(vars.setpoint) + ' C' : 'Idle' }}
                color = {{ sources.climate.ok && sources.climate.value.heating ? theme.warm : theme.muted }}
            }
        }
    }

    row {
        width = 100%
        gap   = 12
        fact {
            glyph = charge
            label = Lights on
            value = {{ string([vars.living, vars.kitchen, vars.bedroom, vars.office, vars.hallway, vars.garden].filter(x, x).size()) }} of 6
        }
        fact { glyph = eye_close; label = Front door; value = {{ sources.house.ok ? sources.house.value.door : '-' }} }
        fact { glyph = battery_3; label = Solar now; value = {{ sources.house.ok ? string(sources.house.value.solar_now) + ' kW' : '-' }} }
        fact { glyph = trash; label = Bins; value = {{ sources.house.ok ? sources.house.value.bins : '-' }} }
    }

    row {
        width = 100%
        gap   = 12
        scene_button { name = Morning; glyph = eye_open }
        scene_button { name = Evening; glyph = home }
        scene_button { name = Movie;   glyph = video }
        scene_button { name = Night;   glyph = eye_close }
        scene_button { name = Away;    glyph = close }
    }
}

page lights {
    title = Lights
    icon  = charge
    nav   = 2

    grid {
        width   = 100%
        columns = 3
        gap     = 12

        room {
            name = Living room; on = {{ vars.living }}; level = {{ vars.living_lvl }}
            toggle { value = {{ vars.living }}; on_change { set { living = {{ value }} } } }
        }
        room {
            name = Kitchen; on = {{ vars.kitchen }}; level = {{ vars.kitchen_lvl }}
            toggle { value = {{ vars.kitchen }}; on_change { set { kitchen = {{ value }} } } }
        }
        room {
            name = Bedroom; on = {{ vars.bedroom }}; level = {{ vars.bedroom_lvl }}
            toggle { value = {{ vars.bedroom }}; on_change { set { bedroom = {{ value }} } } }
        }
        room {
            name = Office; on = {{ vars.office }}; level = {{ vars.office_lvl }}
            toggle { value = {{ vars.office }}; on_change { set { office = {{ value }} } } }
        }
        room {
            name = Hallway; on = {{ vars.hallway }}; level = {{ vars.hallway_lvl }}
            toggle { value = {{ vars.hallway }}; on_change { set { hallway = {{ value }} } } }
        }
        room {
            name = Garden; on = {{ vars.garden }}; level = {{ vars.garden_lvl }}
            toggle { value = {{ vars.garden }}; on_change { set { garden = {{ value }} } } }
        }
    }

    column {
        class = card
        width = 100%
        gap   = 10
        row {
            width   = 100%
            justify = between
            text { value = Living room brightness }
            text { value = {{ string(vars.living_lvl) }}%; color = {{ theme.muted }} }
        }
        slider {
            width = 100%
            min   = 5
            max   = 100
            step  = 5
            value = {{ vars.living_lvl }}
            on_change { set { living_lvl = {{ value }}; living = true } }
        }
    }
}

page climate {
    title = Heating
    icon  = tint
    nav   = 3

    row {
        width = 100%
        grow  = 1
        gap   = 12

        # The thermostat: target on the arc, room temperature under it.
        column {
            class = card
            grow  = 1
            align = center
            gap   = 8
            stack {
                width  = 220
                height = 220
                arc {
                    width     = 220
                    height    = 220
                    min       = 15
                    max       = 26
                    value     = {{ vars.setpoint }}
                    thickness = 16
                    rounded   = true
                    track     = track
                    color     = {{ vars.setpoint >= 20.0 ? theme.warm : theme.cool }}
                }
                column {
                    anchor = center
                    align  = center
                    gap    = 0
                    text { value = {{ string(vars.setpoint) }}; font = {{ theme.font_huge }} }
                    text { value = target C; color = {{ theme.muted }} }
                }
            }
            row {
                gap = 16
                button { width = 72; height = 52; icon = minus; on_tap = cooler }
                button { width = 72; height = 52; icon = plus;  on_tap = warmer }
            }
        }

        column {
            class = card
            grow  = 1
            gap   = 14
            text { value = Rooms; color = {{ theme.muted }} }
            repeat r in {{ sources.climate.ok ? sources.climate.value.rooms : [] }} {
                row {
                    width   = 100%
                    justify = between
                    align   = center
                    text { value = {{ r.name }} }
                    text {
                        value = {{ string(r.temp) }} C
                        font  = {{ theme.font_big }}
                        color = {{ r.temp < vars.setpoint - 1.0 ? theme.cool : theme.text }}
                    }
                }
            }
        }
    }
}

page energy {
    title = Energy
    icon  = battery_3
    nav   = 4

    row {
        width = 100%
        gap   = 12
        column {
            class = card
            grow  = 1
            gap   = 2
            text { value = Solar today; color = {{ theme.muted }} }
            text { value = {{ sources.energy.ok ? string(sources.energy.value.today_solar) + ' kWh' : '-' }}; font = {{ theme.font_big }}; color = {{ theme.warm }} }
        }
        column {
            class = card
            grow  = 1
            gap   = 2
            text { value = Used today; color = {{ theme.muted }} }
            text { value = {{ sources.energy.ok ? string(sources.energy.value.today_usage) + ' kWh' : '-' }}; font = {{ theme.font_big }}; color = {{ theme.cool }} }
        }
        column {
            class = card
            grow  = 1
            gap   = 6
            text { value = Battery; color = {{ theme.muted }} }
            bar { width = 100%; height = 10; min = 0; max = 100; value = {{ sources.energy.ok ? sources.energy.value.battery : 0 }}; track = track; color = ok }
            text { value = {{ sources.energy.ok ? string(sources.energy.value.battery) + '%' : '-' }} }
        }
    }

    column {
        class = card
        width = 100%
        grow  = 1
        gap   = 6
        row {
            gap = 16
            text { value = Today, by hour; color = {{ theme.muted }} }
            text { value = Solar; color = {{ theme.warm }} }
            text { value = Use; color = {{ theme.cool }} }
        }
        chart {
            type      = bar
            width     = 100%
            grow      = 1
            min       = 0
            points    = 24
            divisions = 3 0
            series { values = {{ sources.energy.ok ? sources.energy.value.solar : [] }}; color = warm }
            series { values = {{ sources.energy.ok ? sources.energy.value.usage : [] }}; color = cool }
        }
    }
}
