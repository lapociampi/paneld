# Daylight: a warm light theme for a kitchen or hallway wall. Its
# shell puts a large clock in the header and round tabs at the bottom.
theme daylight {
    background = #f5f1ea
    surface    = #ffffff
    text       = #23201c
    muted      = #8d8579
    accent     = #e8890c
    ok         = #2f9e5b
    info       = #3a7bd5
    warning    = #e8890c
    critical   = #d6453d

    # Extra tokens.
    soft  = #f0e8dc
    track = #ece4d8
    cool  = #3a7bd5
    warm  = #e8890c

    font_small = montserrat 13
    font       = montserrat 16
    font_big   = montserrat 20 bold
    font_huge  = montserrat 44 bold

    gap     = 12
    padding = 14
    radius  = 18
    tap_min = 52
    shadow  = 16 #8d857926 0 6
    icons   = builtin
    motion  = full

    dialog_backdrop = blur 8

    style row    { padding = 0; border = 0 }
    style column { padding = 0; border = 0 }
    style grid   { padding = 0; border = 0 }

    style .card { background = surface; radius = 18; padding = 14; border = 0; shadow = shadow }
    style .card:pressed { background = soft }
    style button { background = soft; color = text; radius = 14; border = 0; shadow = none }
    style button:pressed { background = track }
    style button:checked { background = accent; color = #ffffff }
    style .scene { background = surface; shadow = shadow }

    component shell {
        column {
            width   = 100%
            height  = 100%
            padding = 16 20 12 20
            gap     = 12

            row {
                width   = 100%
                justify = between
                align   = end
                column {
                    gap = 2
                    text { value = {{ now.weekday }}, {{ now.date }}; color = {{ theme.muted }} }
                    text { value = {{ page.title }}; font = {{ theme.font_big }} }
                }
                text { value = {{ now.time }}; font = {{ theme.font_huge }} }
            }

            column {
                width = 100%
                grow  = 1
                gap   = 12
                slot { }
            }

            row {
                width   = 100%
                justify = center
                gap     = 10
                repeat p in {{ nav }} {
                    row {
                        padding    = 10 18
                        gap        = 8
                        radius     = 22
                        align      = center
                        background = {{ p.current ? theme.text : theme.surface }}
                        on_tap { goto = {{ p.name }} }
                        icon { name = {{ p.icon }}; size = 18; color = {{ p.current ? theme.surface : theme.muted }} }
                        text { value = {{ p.title }}; color = {{ p.current ? theme.surface : theme.text }} }
                    }
                }
            }
        }
    }
}
