# Stream deck: a control surface next to your streaming PC. Scenes,
# go live and record, a four-channel mixer, the music, and a pad of
# macro keys, on a small touchscreen of its own (a Pi beside the PC),
# with no browser in between.
#
#   paneld -c examples/stream-deck/paneld.conf
#
# Out of the box it runs on demo data (demo/): its keys only change the
# screen, the numbers move on their own. Above each one is what a real
# deck runs:
#
#   - OBS: its built-in WebSocket server (Tools > WebSocket Server
#     Settings), driven from the Pi with obs-cmd
#     (https://github.com/grigio/obs-cmd); check `obs-cmd --help` for
#     the exact commands of your version.
#   - The PC itself (hotkeys, media keys): over ssh, through the `pc`
#     remote below; xdotool or playerctl on Linux, an AutoHotkey script
#     on Windows.

screen {
    theme = studio        # themes/studio/theme.conf
    idle  = 10m
    fps   = 30
}

app {
    start_page = live
}

# --- The PC ------------------------------------------------------------
# Real: point `host` at the PC and give the Pi a key it accepts.

remote_kind pc_host {
    param host: string
    via  = ssh
    host = {{ host }}
    user = streamer
    key  = /etc/paneld/id_ed25519

    # A key combination the PC's streaming tools listen for.
    action hotkey {
        param keys: string
        run = xdotool key -- {{ keys }}
    }
    # The music player: play-pause, next, previous.
    action media {
        param cmd: string { options = [play-pause, next, previous] }
        run = playerctl {{ cmd }}
    }
}

remote pc: pc_host { host = 192.168.1.20 }

# --- Demo state --------------------------------------------------------
# With OBS these come from it (a source asking its WebSocket for the
# stream, record and input state); here the keys set them.

var live:         bool   = false
var live_since:   int    = 0
var recording:    bool   = false
var rec_since:    int    = 0
var scene:        string = Gaming
var mic_muted:    bool   = false
var cam_off:      bool   = false
var desk_muted:   bool   = false
var music_muted:  bool   = false
var chat_muted:   bool   = false
var vol_mic:      int    = 80
var vol_desk:     int    = 65
var vol_music:    int    = 35
var vol_chat:     int    = 70
var playing:      bool   = true
var play_started: int    = 0
var pos_base:     int    = 0
var light:        bool   = true

# --- Sources -----------------------------------------------------------

# Viewers, bitrate (kb/s), dropped frames (%), fps and the PC's CPU.
# Real: a script that asks OBS (GetStreamStatus and GetStats over its
# WebSocket) and the platform's API, and prints the same JSON.
source stats {
    poll  = 2s
    run   = sh demo/stats.sh
    parse = json
}

# The bitrate alone, with two minutes of history for the chart.
source bitrate {
    poll    = 2s
    run     = sh demo/stats.sh bitrate
    parse   = number
    history = 2m
}

# Audio levels (0-100) for the mixer's meters, only while it is shown.
# Real: OBS's input volume meters (InputVolumeMeters) through a small
# script, or the PC's mixer.
source levels {
    poll   = 1s
    run    = sh demo/levels.sh
    parse  = json
    active = visible
}

# The track playing, with `cover`: a PNG of its artwork, relative to
# this folder. Real: a script on the Pi that asks the PC (ssh ...
# playerctl metadata) for the title, artist, album, length and
# mpris:artUrl, fetches the artwork, converts it to a PNG of at most
# 800x480 (ffmpeg -i art.jpg -vf scale=480:-1 covers/<track id>.png)
# and prints the JSON. A new file name per track: a picture is decoded
# once per path.
source track {
    poll  = 30s
    run   = cat demo/track.json
    parse = json
}

# --- Actions -----------------------------------------------------------

# Real: run = obs-cmd streaming toggle
action stream_toggle {
    confirm = {{ vars.live ? 'End the stream now?' : 'Go live now?' }}
    run     = sleep 0.6
    busy    = {{ vars.live ? 'Ending' : 'Going live' }}
    set {
        live       = {{ !vars.live }}
        live_since = {{ now.unix }}
    }
}

# Real: run = obs-cmd recording toggle
action record_toggle {
    run = sleep 0.3
    set {
        recording = {{ !vars.recording }}
        rec_since = {{ now.unix }}
    }
}

# Real: run = obs-cmd scene switch Gaming (and so on)
action scene_gaming   { set { scene = Gaming } }
action scene_chatting { set { scene = Just chatting } }
action scene_cam      { set { scene = Desk cam } }
action scene_starting { set { scene = Starting soon } }
action scene_brb      { set { scene = Be right back } }
action scene_ending   { set { scene = Ending } }

# Real: run = obs-cmd toggle-mute Mic/Aux (and the other inputs)
action mute_mic   { set { mic_muted   = {{ !vars.mic_muted }} } }
action mute_desk  { set { desk_muted  = {{ !vars.desk_muted }} } }
action mute_music { set { music_muted = {{ !vars.music_muted }} } }
action mute_chat  { set { chat_muted  = {{ !vars.chat_muted }} } }
# Real: run = obs-cmd ... (hide the camera source in the scene)
action cam_toggle { set { cam_off = {{ !vars.cam_off }} } }

# Real: run = obs-cmd ... (SetInputVolume), from the slider's value.
action vol_mic   { param value: int; set { vol_mic   = {{ value }} } }
action vol_desk  { param value: int; set { vol_desk  = {{ value }} } }
action vol_music { param value: int; set { vol_music = {{ value }} } }
action vol_chat  { param value: int; set { vol_chat  = {{ value }} } }

# Real: run = ssh ... playerctl play-pause (on_tap pc.media { cmd = play-pause })
action play_pause {
    set {
        pos_base     = {{ vars.playing ? (vars.pos_base + now.unix - vars.play_started) % sources.track.value.length : vars.pos_base }}
        play_started = {{ now.unix }}
        playing      = {{ !vars.playing }}
    }
}
action track_restart {
    set {
        pos_base     = 0
        play_started = {{ now.unix }}
    }
}

# Macro keys. Real: a hotkey your streaming tools listen for, e.g.
# on_tap pc.hotkey { keys = ctrl+alt+c }, or an obs-cmd command.
action clip       { run = sleep 0.8; busy = Clipping; done = Clipped }
action screenshot { run = sleep 0.4; done = Saved }
action marker     { run = sleep 0.3; done = Marked }
action ad_break   { confirm = Run a 90 second ad break?; run = sleep 0.6; done = Ads running }
action shoutout   { run = sleep 0.5; done = Sent }
action hydrate    { run = sleep 0.3; done = Cheers }
action key_light  { set { light = {{ !vars.light }} } }

# --- Alerts ------------------------------------------------------------

alert frames_dropping {
    when     = {{ vars.live && sources.stats.ok && sources.stats.value.dropped > 1.5 }}
    for      = 6s
    severity = warning
    title    = Frames dropping
    text     = {{ sources.stats.ok ? string(sources.stats.value.dropped) + '% in the last seconds' : '' }}
}

# --- Components --------------------------------------------------------

# What a scene tile shows: a shade for the name, and a tag on the one
# on air.
component scene_face {
    param name: string
    param on: bool

    column {
        width      = 100%
        height     = 100%
        radius     = 15
        padding    = 9 11
        justify    = between
        background = linear 180 #00000000 #00000000 #000000c8
        row {
            opacity    = {{ on ? 1 : 0 }}
            padding    = 3 8
            radius     = 8
            gap        = 5
            align      = center
            background = {{ vars.live ? theme.live : theme.violet }}
            icon { name = live; size = 12; color = #ffffff }
            text { value = {{ vars.live ? 'ON AIR' : 'PROGRAM' }}; font = inter 10 bold; color = #ffffff }
        }
        text { value = {{ name }}; font = {{ theme.font_label }}; color = #ffffff; width = 100%; overflow = dots }
    }
}

# One OBS scene: its picture and name; the one on air in a lit frame
# that fades in when it is chosen.
component scene_tile {
    param name: string
    param art: string
    param tap: action

    column {
        height = 100%
        column {
            visible    = {{ vars.scene == name }}
            enter      = fade 220ms
            width      = 100%
            height     = 100%
            radius     = 16
            background = {{ art }}
            border     = 2 #7c5cff
            shadow     = glow_on
            scene_face { name = {{ name }}; on = true }
        }
        column {
            visible    = {{ vars.scene != name }}
            class      = tile
            width      = 100%
            height     = 100%
            radius     = 16
            background = {{ art }}
            border     = 1 #ffffff1a
            shadow     = shadow
            on_tap     = {{ tap }}
            scene_face { name = {{ name }}; on = false }
        }
    }
}

# A switch for a source: its icon and name, red when it is off.
component chip {
    param glyph: string
    param label: string
    param off: bool
    param tap: action

    button {
        grow       = 1
        height     = 60
        on_tap     = {{ tap }}
        background = {{ off ? 'linear 135 #3a0d18 #2a0a12' : theme.raised }}
        border     = {{ off ? '1 #ff2d5580' : '1 #ffffff1f' }}
        row {
            gap   = 9
            align = center
            icon { name = {{ glyph }}; size = 22; color = {{ off ? theme.live : theme.text }} }
            column {
                gap = 1
                text { value = {{ label }}; font = {{ theme.font_label }}; color = {{ theme.text }} }
                text { value = {{ off ? 'Off' : 'On' }}; font = {{ theme.font_small }}; color = {{ off ? theme.live : theme.green }} }
            }
        }
    }
}

# A figure in the stream's panel.
component figure {
    param label: string
    param value: string
    param warn: bool = false

    column {
        grow = 1
        gap  = 1
        text { value = {{ label }}; font = {{ theme.font_small }}; color = {{ theme.muted }} }
        text { value = {{ value }}; font = {{ theme.font_label }}; color = {{ warn ? theme.amber : theme.text }} }
    }
}

# A mixer channel: its meter, its fader, and its mute key.
component strip {
    param glyph: string
    param glyph_off: string
    param label: string
    param level: number
    param volume: int
    param muted: bool
    param mute: action
    param change: action
    param hue: color

    column {
        class   = panel
        grow    = 1
        height  = 100%
        gap     = 10
        align   = center
        row {
            gap   = 7
            align = center
            icon { name = {{ glyph }}; size = 18; color = {{ hue }} }
            text { value = {{ label }}; font = {{ theme.font_label }} }
        }
        # Room on the sides: the fader's knob is wider than its track.
        row {
            grow    = 1
            gap     = 14
            padding = 0 12
            justify = center
            # The level, green to red as it gets loud; flat when muted.
            bar {
                direction = vertical
                width     = 10
                height    = 100%
                radius    = 5
                value     = {{ muted ? 0 : level * volume / 100 }}
                color     = {{ level * volume / 100 > 80 ? theme.live : level * volume / 100 > 60 ? theme.amber : theme.green }}
                track     = #ffffff10
            }
            slider {
                direction = vertical
                width     = 12
                height    = 100%
                min       = 0
                max       = 100
                step      = 5
                value     = {{ volume }}
                color     = {{ hue }}
                on_change = {{ change }}
            }
        }
        text { value = {{ string(volume) }}%; font = {{ theme.font_num }}; color = {{ muted ? theme.muted : theme.text }} }
        # Muted: a red key that glows (fading in); else a plain one.
        button {
            visible    = {{ muted }}
            enter      = fade 200ms
            width      = 100%
            height     = 50
            on_tap     = {{ mute }}
            background = linear 135 #ff2d55 #ff7a3d
            border     = 0 #00000000
            shadow     = 20 #ff2d5588 0 0
            icon       = {{ glyph_off }}
            label      = Muted
        }
        button {
            visible = {{ !muted }}
            width   = 100%
            height  = 50
            on_tap  = {{ mute }}
            icon    = {{ glyph }}
            label   = On air
        }
    }
}

# An icon of a given size in the middle of its parent (a key): the
# `icon` shortcut centres one too, but at the theme's font size.
component centred {
    param glyph: string
    param size: int

    column {
        width   = 100%
        height  = 100%
        justify = center
        align   = center
        icon { name = {{ glyph }}; size = {{ size }}; color = #ffffff }
    }
}

# A macro key: a glossy tile in its own colour. A key that stays on
# (the light, a mute) gets a white frame and glow, fading in.
component key {
    param glyph: string
    param label: string
    param from: color
    param to: color
    param tap: action
    param lit: bool = false

    column {
        button {
            visible    = {{ lit }}
            enter      = fade 200ms
            width      = 100%
            height     = 120
            on_tap     = {{ tap }}
            radius     = 22
            background = {{ 'linear 135 ' + from + ' ' + to }}
            border     = 2 #ffffffdd
            shadow     = glow_key
            key_face { glyph = {{ glyph }}; label = {{ label }} }
        }
        button {
            visible    = {{ !lit }}
            width      = 100%
            height     = 120
            on_tap     = {{ tap }}
            radius     = 22
            background = {{ 'linear 135 ' + from + ' ' + to }}
            border     = 1 #ffffff30
            key_face { glyph = {{ glyph }}; label = {{ label }} }
        }
    }
}

component key_face {
    param glyph: string
    param label: string

    column {
        width = 100%
        gap   = 8
        align = center
        icon { name = {{ glyph }}; size = 34; color = #ffffff }
        text { value = {{ label }}; font = {{ theme.font_label }}; color = #ffffff }
    }
}

# --- Pages -------------------------------------------------------------

page live {
    title = Live
    icon  = live
    nav   = 1

    row {
        width = 100%
        grow  = 1
        gap   = 12

        column {
            grow   = 1
            height = 100%
            gap    = 12

            column {
                class = panel
                width = 100%
                grow  = 1
                gap   = 10
                row {
                    width   = 100%
                    justify = between
                    align   = center
                    row {
                        gap   = 8
                        align = center
                        icon { name = layers; size = 18; color = {{ theme.violet }} }
                        text { value = Scenes; font = {{ theme.font_label }} }
                    }
                    text { value = {{ vars.scene }}; font = {{ theme.font_small }}; color = {{ theme.muted }} }
                }
                # Two rows sharing the panel: the tiles give way to the
                # alert banner when it slides in.
                grid {
                    width   = 100%
                    grow    = 1
                    columns = 3
                    rows    = [1fr, 1fr]
                    gap     = 10
                    scene_tile { name = Gaming;        art = themes/studio/images/scene_gaming.png;   tap = scene_gaming }
                    scene_tile { name = Just chatting; art = themes/studio/images/scene_chatting.png; tap = scene_chatting }
                    scene_tile { name = Desk cam;      art = themes/studio/images/scene_cam.png;      tap = scene_cam }
                    scene_tile { name = Starting soon; art = themes/studio/images/scene_starting.png; tap = scene_starting }
                    scene_tile { name = Be right back; art = themes/studio/images/scene_brb.png;      tap = scene_brb }
                    scene_tile { name = Ending;        art = themes/studio/images/scene_ending.png;   tap = scene_ending }
                }
            }

            row {
                width = 100%
                gap   = 10
                chip { glyph = {{ vars.mic_muted ? 'mic_off' : 'mic' }}; label = Mic; off = {{ vars.mic_muted }}; tap = mute_mic }
                chip { glyph = {{ vars.cam_off ? 'cam_off' : 'cam' }}; label = Camera; off = {{ vars.cam_off }}; tap = cam_toggle }
                chip { glyph = desktop; label = Desktop; off = {{ vars.desk_muted }}; tap = mute_desk }
                chip { glyph = music; label = Music; off = {{ vars.music_muted }}; tap = mute_music }
            }
        }

        column {
            width  = 236
            height = 100%
            gap    = 12

            button {
                width      = 100%
                height     = 78
                on_tap     = stream_toggle
                radius     = 22
                background = {{ vars.live ? 'linear 135 #2a0a12 #3a0d18' : 'linear 135 #ff2d55 #ff7a3d' }}
                border     = {{ vars.live ? '2 #ff2d55' : '1 #ffffff40' }}
                shadow     = glow_live
                row {
                    gap   = 10
                    align = center
                    icon { name = live; size = 28; color = #ffffff }
                    column {
                        gap = 0
                        text { value = {{ vars.live ? 'End stream' : 'Go live' }}; font = {{ theme.font_big }}; color = #ffffff }
                        text { value = {{ vars.live ? 'Live on Twitch' : 'Ready' }}; font = {{ theme.font_small }}; color = #ffffffbb }
                    }
                }
            }

            button {
                width      = 100%
                height     = 52
                on_tap     = record_toggle
                background = {{ vars.recording ? 'linear 135 #2a0a12 #3a0d18' : theme.raised }}
                border     = {{ vars.recording ? '1 #ff2d5599' : '1 #ffffff1f' }}
                icon       = {{ vars.recording ? 'stop' : 'rec' }}
                label      = {{ vars.recording ? 'Stop recording' : 'Record' }}
            }

            column {
                class = panel
                width = 100%
                grow  = 1
                gap   = 8
                row {
                    width   = 100%
                    justify = between
                    align   = end
                    column {
                        gap = 0
                        text { value = Bitrate; font = {{ theme.font_small }}; color = {{ theme.muted }} }
                        text {
                            value = {{ vars.live && sources.bitrate.ok ? string(round(sources.bitrate.value / 1000.0, 1)) : '-' }}
                            font  = {{ theme.font_num }}
                        }
                    }
                    text { value = Mb/s; font = {{ theme.font_small }}; color = {{ theme.muted }}; padding = 0 0 6 0 }
                }
                chart {
                    width  = 100%
                    grow   = 1
                    type   = area
                    min    = 4000
                    max    = 7500
                    divisions = 2 0
                    series { values = {{ vars.live && sources.bitrate.ok ? sources.bitrate.history : [] }}; color = {{ theme.cyan }} }
                }
                row {
                    width = 100%
                    gap   = 6
                    figure { label = Dropped; value = {{ vars.live && sources.stats.ok ? string(sources.stats.value.dropped) + '%' : '-' }}; warn = {{ vars.live && sources.stats.ok && sources.stats.value.dropped > 1.5 }} }
                    figure { label = FPS; value = {{ vars.live && sources.stats.ok ? string(sources.stats.value.fps) : '-' }} }
                    figure { label = CPU; value = {{ sources.stats.ok ? string(sources.stats.value.cpu) + '%' : '-' }} }
                }
            }
        }
    }
}

page audio {
    title = Mixer
    icon  = audio
    nav   = 2

    row {
        width = 100%
        grow  = 1
        gap   = 12
        strip {
            glyph = mic; glyph_off = mic_off; label = Mic; hue = {{ theme.violet }}
            level = {{ sources.levels.ok ? sources.levels.value.mic : 0 }}
            volume = {{ vars.vol_mic }}; muted = {{ vars.mic_muted }}; mute = mute_mic; change = vol_mic
        }
        strip {
            glyph = desktop; glyph_off = mute; label = Desktop; hue = {{ theme.cyan }}
            level = {{ sources.levels.ok ? sources.levels.value.desktop : 0 }}
            volume = {{ vars.vol_desk }}; muted = {{ vars.desk_muted }}; mute = mute_desk; change = vol_desk
        }
        strip {
            glyph = music; glyph_off = mute; label = Music; hue = {{ theme.pink }}
            level = {{ sources.levels.ok ? sources.levels.value.music : 0 }}
            volume = {{ vars.vol_music }}; muted = {{ vars.music_muted }}; mute = mute_music; change = vol_music
        }
        strip {
            glyph = headset; glyph_off = headset_off; label = Voice chat; hue = {{ theme.amber }}
            level = {{ sources.levels.ok ? sources.levels.value.chat : 0 }}
            volume = {{ vars.vol_chat }}; muted = {{ vars.chat_muted }}; mute = mute_chat; change = vol_chat
        }
    }
}

page media {
    title = Music
    icon  = music
    nav   = 3

    row {
        width = 100%
        grow  = 1
        gap   = 24
        align = center
        padding = 0 10

        # The cover, as a rounded background (clipped to its radius),
        # glowing in its own colours: the track's own picture when the
        # source gives one (`cover`, a PNG path), else the demo's. Both
        # sides are 268 high, the cover on top: the controls' bottom
        # lines up with the cover's, their glow in the 18 px below.
        column {
            height = 268
            rect {
                width      = 250
                height     = 250
                radius     = 26
                border     = 0 #00000000
                background = {{ sources.track.ok && has(sources.track.value.cover) ? sources.track.value.cover : 'themes/studio/images/album.png' }}
                shadow     = 32 #ff2d78aa 0 10
            }
        }

        column {
            width   = 456
            height  = 268
            justify = between

            column {
                width = 100%
                gap   = 4
                text { value = Now playing; font = {{ theme.font_small }}; color = {{ theme.muted }} }
                text { value = {{ sources.track.ok ? sources.track.value.title : '-' }}; font = montserrat 30 bold; width = 100%; overflow = dots }
                text { value = {{ sources.track.ok ? sources.track.value.artist + '  -  ' + sources.track.value.album : '' }}; color = {{ theme.muted }}; width = 100%; overflow = dots }
            }

            column {
                width = 100%
                gap   = 6
                bar {
                    width  = 100%
                    height = 6
                    radius = 3
                    min    = 0
                    max    = {{ sources.track.ok ? sources.track.value.length : 1 }}
                    value  = {{ sources.track.ok ? (vars.playing ? (vars.pos_base + now.unix - vars.play_started) % sources.track.value.length : vars.pos_base) : 0 }}
                    color  = {{ theme.pink }}
                    track  = #ffffff18
                }
                row {
                    width   = 100%
                    justify = between
                    text {
                        value = {{ sources.track.ok ? duration((vars.playing ? (vars.pos_base + now.unix - vars.play_started) % sources.track.value.length : vars.pos_base)) : '' }}
                        font  = {{ theme.font_small }}
                        color = {{ theme.muted }}
                    }
                    text { value = {{ sources.track.ok ? duration(sources.track.value.length) : '' }}; font = {{ theme.font_small }}; color = {{ theme.muted }} }
                }
            }

            # Padding below: the play key's glow is drawn outside it.
            row {
                gap     = 18
                align   = center
                padding = 4 0 18 0
                button { class = round; width = 64; height = 64; on_tap = track_restart; centred { glyph = prev; size = 26 } }
                button {
                    class      = round
                    width      = 84
                    height     = 84
                    on_tap     = play_pause
                    background = linear 135 #ff4fd8 #7c5cff
                    border     = 0 #00000000
                    shadow     = 30 #c04dffaa 0 6
                    centred { glyph = {{ vars.playing ? 'pause' : 'play' }}; size = 36 }
                }
                button { class = round; width = 64; height = 64; on_tap = track_restart; centred { glyph = next; size = 26 } }
            }
        }
    }
}

page macros {
    title = Macros
    icon  = spark
    nav   = 4

    grid {
        width   = 100%
        columns = 4
        gap     = 14
        key { glyph = cut;       label = Clip it;      from = #7c5cff; to = #c04dff; tap = clip }
        key { glyph = shot;      label = Screenshot;   from = #0ea5e9; to = #22d3ee; tap = screenshot }
        key { glyph = flag;      label = Marker;       from = #10b981; to = #2fd18a; tap = marker }
        key { glyph = tv;        label = Ad break;     from = #f59e0b; to = #ffb020; tap = ad_break }
        key { glyph = coffee;    label = Be right back; from = #b45309; to = #f97316; tap = scene_brb }
        key { glyph = clock;     label = Starting soon; from = #0d9488; to = #2dd4bf; tap = scene_starting }
        key { glyph = moon;      label = Ending;       from = #4338ca; to = #6d4dff; tap = scene_ending }
        key { glyph = megaphone; label = Shout-out;    from = #db2777; to = #ff4fd8; tap = shoutout }
        key { glyph = {{ vars.mic_muted ? 'mic_off' : 'mic' }}; label = {{ vars.mic_muted ? 'Unmute' : 'Mute mic' }}; from = #be123c; to = #ff2d55; tap = mute_mic; lit = {{ vars.mic_muted }} }
        key { glyph = {{ vars.chat_muted ? 'headset_off' : 'headset' }}; label = {{ vars.chat_muted ? 'Undeafen' : 'Deafen' }}; from = #9f1239; to = #f43f5e; tap = mute_chat; lit = {{ vars.chat_muted }} }
        key { glyph = bulb;      label = Key light;    from = #ca8a04; to = #facc15; tap = key_light; lit = {{ vars.light }} }
        key { glyph = heart;     label = Hydrate;      from = #0891b2; to = #38bdf8; tap = hydrate }
    }
}
