# Studio: a dark broadcast desk. Keys are glossy tiles that glow in
# their own colour, the on-air state glows red, values ease into place
# and pages fade. Icons and art are drawn for this example (src/,
# rendered by make-assets.sh).
theme studio {
    background       = #07080c
    background_image = images/backdrop.png
    surface          = #141722
    text             = #f3f5fb
    muted            = #8b91a8
    accent           = #7c5cff
    ok               = #2fd18a
    info             = #38bdf8
    warning          = #ffb020
    critical         = #ff2d55

    # Extra tokens.
    panel   = #11131cd9
    raised  = #1c2030
    edge    = #ffffff17
    track   = #242838
    live    = #ff2d55
    live_2  = #ff7a3d
    violet  = #7c5cff
    violet_2 = #c04dff
    cyan    = #22d3ee
    green   = #2fd18a
    amber   = #ffb020
    pink    = #ff4fd8

    font_small = inter 12
    font       = inter 15
    font_big   = inter 20 bold
    font_huge  = montserrat 40 bold
    font_label = inter 13 bold
    font_num   = montserrat 26 bold

    gap     = 12
    padding = 14
    radius  = 18
    tap_min = 52
    icons   = icons

    # Lifted keys, and the glows of the live and chosen states.
    shadow    = 18 #00000099 0 8
    glow_live = 28 #ff2d55aa 0 0
    glow_on   = 24 #7c5cff99 0 0
    glow_key  = 26 #ffffff88 0 0

    motion            = full
    page_transition   = fade 180ms
    value_transition  = 450ms
    tap_transition    = 80ms
    banner_transition = slide 260ms
    dialog_backdrop   = blur 10

    style row    { padding = 0; border = 0 }
    style column { padding = 0; border = 0 }
    style grid   { padding = 0; border = 0 }
    style stack  { padding = 0; border = 0 }

    # Panels: smoked glass over the backdrop.
    style .panel { background = panel; radius = 20; padding = 14; border = 1 #ffffff12 }

    # Keys: a soft lift and a hairline edge; pressed, they sink.
    style button { radius = 18; border = 1 #ffffff1f; shadow = shadow; color = text; font = inter 13 bold; background = raised }
    style button:pressed { scale = 0.93; opacity = 0.86 }
    style button:running { opacity = 0.7 }
    style .tile:pressed { scale = 0.95 }
    style .round { radius = 99 }

    style slider { color = accent; track = track }

    # The page shell: on-air status, the pages as pills and the
    # audience across the top, the page below, and the alert banner
    # sliding in under the top bar.
    component shell {
        column {
            width   = 100%
            height  = 100%
            padding = 10 16 14 16
            gap     = 10

            row {
                width   = 100%
                height  = 44
                align   = center
                gap     = 10

                # On air: a red pill that glows, with the stream's time;
                # off air, a quiet one. The glow fades in as it goes live.
                row {
                    visible    = {{ vars.live }}
                    enter      = fade 300ms
                    padding    = 0 14
                    height     = 36
                    gap        = 8
                    align      = center
                    radius     = 18
                    background = linear 90 #ff2d55 #ff7a3d
                    shadow     = glow_live
                    on_tap { goto = live }
                    icon { name = live; size = 18; color = #ffffff }
                    text { value = ON AIR; font = {{ theme.font_label }}; color = #ffffff }
                    text { value = {{ string((now.unix - vars.live_since) / 3600) + ':' + ((now.unix - vars.live_since) % 3600 / 60 < 10 ? '0' : '') + string((now.unix - vars.live_since) % 3600 / 60) + ':' + ((now.unix - vars.live_since) % 60 < 10 ? '0' : '') + string((now.unix - vars.live_since) % 60) }}; font = {{ theme.font_label }}; color = #ffffffcc }
                }
                row {
                    visible    = {{ !vars.live }}
                    padding    = 0 14
                    height     = 36
                    gap        = 8
                    align      = center
                    radius     = 18
                    background = panel
                    border     = 1 #ffffff17
                    on_tap { goto = live }
                    icon { name = live; size = 18; color = {{ theme.muted }} }
                    text { value = OFFLINE; font = {{ theme.font_label }}; color = {{ theme.muted }} }
                }

                # Recording: its own small pill while it runs.
                row {
                    visible    = {{ vars.recording }}
                    enter      = fade 250ms
                    padding    = 0 12
                    height     = 36
                    gap        = 6
                    align      = center
                    radius     = 18
                    background = {{ theme.panel }}
                    border     = 1 #ff2d5566
                    icon { name = rec; size = 16; color = {{ theme.live }} }
                    text { value = {{ string((now.unix - vars.rec_since) / 3600) + ':' + ((now.unix - vars.rec_since) % 3600 / 60 < 10 ? '0' : '') + string((now.unix - vars.rec_since) % 3600 / 60) + ':' + ((now.unix - vars.rec_since) % 60 < 10 ? '0' : '') + string((now.unix - vars.rec_since) % 60) }}; font = {{ theme.font_label }}; color = {{ theme.text }} }
                }

                # The pages, as pills: the current one lit.
                row {
                    grow    = 1
                    justify = center
                    gap     = 6
                    repeat p in {{ nav }} {
                        row {
                            visible    = {{ p.current }}
                            height     = 36
                            padding    = 0 14
                            gap        = 7
                            align      = center
                            radius     = 18
                            background = linear 90 #7c5cff #c04dff
                            shadow     = glow_on
                            icon { name = {{ p.icon }}; size = 17; color = #ffffff }
                            text { value = {{ p.title }}; font = {{ theme.font_label }}; color = #ffffff }
                        }
                        row {
                            visible = {{ !p.current }}
                            height  = 36
                            padding = 0 14
                            gap     = 7
                            align   = center
                            radius  = 18
                            on_tap { goto = {{ p.name }} }
                            icon { name = {{ p.icon }}; size = 17; color = {{ theme.muted }} }
                            text { value = {{ p.title }}; font = {{ theme.font_label }}; color = {{ theme.muted }} }
                        }
                    }
                }

                # The audience and the time.
                row {
                    gap   = 6
                    align = center
                    icon { name = eye; size = 17; color = {{ theme.muted }} }
                    text {
                        value = {{ vars.live && sources.stats.ok ? string(sources.stats.value.viewers) : '-' }}
                        font  = {{ theme.font_label }}
                        color = {{ theme.text }}
                    }
                    text { value = {{ now.time }}; font = {{ theme.font_label }}; color = {{ theme.muted }}; padding = 0 0 0 10 }
                }
            }

            # The most urgent alert, sliding in under the top bar.
            row {
                visible    = {{ len(alerts.shown) > 0 }}
                enter      = {{ theme.banner_transition }}
                width      = 100%
                padding    = 10 14
                gap        = 10
                align      = center
                radius     = 14
                background = {{ len(alerts.shown) > 0 && alerts.shown[0].severity == 'critical' ? 'linear 90 #ff2d55 #ff7a3d' : 'linear 90 #ffb020 #ff7a3d' }}
                shadow     = 20 #00000080 0 6
                on_tap alert_ack { id = {{ len(alerts.shown) > 0 ? alerts.shown[0].id : '' }} }
                icon { name = warning; size = 18; color = #ffffff }
                text {
                    grow     = 1
                    overflow = dots
                    value    = {{ len(alerts.shown) > 0 ? alerts.shown[0].title + (alerts.shown[0].text != '' ? ': ' + alerts.shown[0].text : '') : '' }}
                    font     = {{ theme.font_label }}
                    color    = #ffffff
                }
                text { value = Tap to dismiss; font = {{ theme.font_small }}; color = #ffffffcc }
            }

            column {
                width = 100%
                grow  = 1
                gap   = 12
                slot { }
            }
        }
    }
}
