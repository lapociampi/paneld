[workspace]
resolver = "2"
members = [
    "crates/paneld",
    "crates/paneld-config",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lapociampi/paneld"

[workspace.dependencies]
paneld-config = { path = "crates/paneld-config" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
